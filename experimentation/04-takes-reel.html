<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>04 — Takes reel</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
      background: #d9ebe0; font-family: Sora, system-ui, sans-serif; color: #143d2a;
    }
    .frame {
      width: 390px; height: 844px; border-radius: 42px; background: #ecf6ef;
      border: 10px solid #10281c; overflow: hidden; position: relative;
      box-shadow: 0 40px 80px rgba(16, 40, 28, 0.28);
      display: flex; flex-direction: column;
    }
    .notch {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 118px; height: 28px; border-radius: 20px; background: #10281c; z-index: 5;
    }
    .bar {
      padding: 54px 20px 8px; display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; font-weight: 600;
    }
    .bar .rec { color: #c0392b; }
    .prompt {
      flex: 1; margin: 6px 16px; border-radius: 24px; background: #fff;
      border: 1px solid rgba(20, 61, 42, 0.08);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 24px; gap: 14px;
      font-family: "Source Serif 4", Georgia, serif;
      box-shadow: 0 10px 30px rgba(20, 61, 42, 0.06);
    }
    .prompt .a { font-size: 17px; opacity: 0.3; }
    .prompt .b { font-size: 26px; font-weight: 600; max-width: 16ch; line-height: 1.3; }
    .prompt .c { font-size: 17px; opacity: 0.4; }
    .reel-label {
      padding: 14px 20px 6px; font-size: 11px; letter-spacing: 0.08em;
      text-transform: uppercase; font-weight: 700; opacity: 0.45;
    }
    .reel {
      display: flex; gap: 10px; padding: 0 16px 8px; overflow: hidden;
    }
    .take {
      min-width: 132px; padding: 12px; border-radius: 16px;
      background: rgba(255,255,255,0.7); border: 1px solid rgba(20,61,42,0.1);
    }
    .take.active { border-color: #2f6f5e; box-shadow: 0 0 0 3px rgba(47,111,94,0.15); }
    .wave {
      height: 28px; display: flex; align-items: center; gap: 2px; margin-bottom: 8px;
    }
    .wave i {
      flex: 1; border-radius: 99px; background: #2f6f5e;
    }
    .take strong { display: block; font-size: 12px; }
    .take span { font-size: 11px; opacity: 0.5; }
    .dock {
      padding: 12px 20px 36px; display: flex; align-items: center; justify-content: space-between;
    }
    .btn {
      height: 44px; padding: 0 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
      background: rgba(20,61,42,0.08); display: grid; place-items: center;
    }
    .rec-btn {
      width: 72px; height: 72px; border-radius: 50%;
      background: #143d2a; box-shadow: 0 10px 24px rgba(20,61,42,0.3);
      display: grid; place-items: center;
    }
    .rec-btn span { width: 22px; height: 22px; border-radius: 6px; background: #ecf6ef; }
    .tag { position: absolute; bottom: 14px; left: 24px; font-size: 11px; opacity: 0.4; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="notch"></div>
    <div class="bar">
      <span>Spanish · Cue 5</span>
      <span class="rec">● Ready</span>
    </div>
    <div class="prompt">
      <p class="a">¿Dónde está la estación?</p>
      <p class="b">Where is the train station?</p>
      <p class="c">Speak clearly — then pause.</p>
    </div>
    <div class="reel-label">Takes</div>
    <div class="reel">
      <div class="take">
        <div class="wave">
          <i style="height:40%"></i><i style="height:70%"></i><i style="height:55%"></i>
          <i style="height:85%"></i><i style="height:45%"></i><i style="height:60%"></i>
        </div>
        <strong>Take 1</strong><span>0:18</span>
      </div>
      <div class="take active">
        <div class="wave">
          <i style="height:50%"></i><i style="height:80%"></i><i style="height:65%"></i>
          <i style="height:90%"></i><i style="height:48%"></i><i style="height:72%"></i>
        </div>
        <strong>Take 2</strong><span>0:21 · best</span>
      </div>
      <div class="take">
        <div class="wave">
          <i style="height:30%"></i><i style="height:44%"></i><i style="height:38%"></i>
          <i style="height:52%"></i><i style="height:35%"></i><i style="height:40%"></i>
        </div>
        <strong>Take 3</strong><span>0:12</span>
      </div>
    </div>
    <div class="dock">
      <div class="btn">Script</div>
      <div class="rec-btn"><span></span></div>
      <div class="btn">Export</div>
    </div>
    <div class="tag">04 · Takes reel</div>
  </div>
</body>
</html>
