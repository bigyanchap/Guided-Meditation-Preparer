<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>02 — Night booth</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: #07090c; color: #e8edf2; padding: 32px 16px;
      font-family: "DM Sans", system-ui, sans-serif;
    }
    .frame {
      width: 390px; height: 844px; border-radius: 42px;
      background: linear-gradient(180deg, #141a22, #0b0e13);
      border: 10px solid #2a3038;
      box-shadow: 0 0 0 1px #111, 0 40px 90px rgba(0,0,0,0.55);
      overflow: hidden; display: flex; flex-direction: column; position: relative;
    }
    .notch {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 118px; height: 28px; border-radius: 20px; background: #000; z-index: 5;
    }
    .hdr {
      padding: 56px 24px 12px; display: flex; justify-content: space-between; align-items: baseline;
    }
    .hdr h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 28px; font-weight: 400; font-style: italic;
    }
    .hdr small { font-size: 12px; opacity: 0.45; letter-spacing: 0.04em; }
    .meter {
      margin: 8px 24px 0; height: 48px; display: flex; align-items: flex-end; gap: 3px;
    }
    .meter span {
      flex: 1; border-radius: 3px 3px 0 0;
      background: linear-gradient(180deg, #7ec8e8, #3d7ea6);
      opacity: 0.85;
    }
    .script {
      flex: 1; margin: 20px 20px 0; padding: 28px 22px;
      border-radius: 24px; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      display: flex; flex-direction: column; justify-content: center; gap: 16px;
      text-align: center; font-family: "Instrument Serif", Georgia, serif;
    }
    .script .soft { font-size: 20px; opacity: 0.28; }
    .script .now { font-size: 30px; color: #f2f7fb; }
    .script .soft2 { font-size: 20px; opacity: 0.35; }
    .controls {
      padding: 22px 28px 40px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    }
    .ghost {
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12); opacity: 0.7;
      display: grid; place-items: center; font-size: 12px; justify-self: start;
    }
    .ghost.r { justify-self: end; }
    .orb {
      width: 92px; height: 92px; border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #5aa7cc, #1f4e68 70%, #0f2a38);
      box-shadow: 0 0 0 6px rgba(61,126,166,0.2), 0 0 40px rgba(61,126,166,0.35);
      display: grid; place-items: center;
    }
    .orb i { width: 22px; height: 22px; border-radius: 5px; background: #e8edf2; }
    .tag { position: absolute; bottom: 18px; left: 24px; font-size: 11px; opacity: 0.35; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="notch"></div>
    <div class="hdr">
      <h1>Booth take</h1>
      <small>EP 04 · VO</small>
    </div>
    <div class="meter" aria-hidden>
      <span style="height:28%"></span><span style="height:46%"></span><span style="height:62%"></span>
      <span style="height:88%"></span><span style="height:70%"></span><span style="height:54%"></span>
      <span style="height:76%"></span><span style="height:40%"></span><span style="height:58%"></span>
      <span style="height:34%"></span><span style="height:66%"></span><span style="height:48%"></span>
      <span style="height:72%"></span><span style="height:38%"></span><span style="height:55%"></span>
      <span style="height:81%"></span><span style="height:44%"></span><span style="height:60%"></span>
    </div>
    <div class="script">
      <p class="soft">Welcome back.</p>
      <p class="now">Today we’re talking about attention — and how little of it we actually own.</p>
      <p class="soft2">Stay with me for the next eight minutes.</p>
    </div>
    <div class="controls">
      <div class="ghost">↺</div>
      <div class="orb"><i></i></div>
      <div class="ghost r">☰</div>
    </div>
    <div class="tag">02 · Night booth</div>
  </div>
</body>
</html>
